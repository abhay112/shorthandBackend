version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorthnd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5001
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
    ports:
      - '127.0.0.1:5001:5001'
    # Critical: Chrome/Puppeteer requires sufficient shared memory
    # Default Docker shm is 64MB which causes "Target closed" errors
    shm_size: '2gb'
    # Security context for Chrome sandboxing
    security_opt:
      - seccomp:unconfined
    # Cap add for Chrome
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
