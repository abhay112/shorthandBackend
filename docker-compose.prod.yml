version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorthnd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5001
      NODE_ENV: production
      LOKI_URL: http://loki:3100
      ENABLE_LOKI_LOGS: "true"
      DOCKER_CONTAINER: "true"
    ports:
      - '127.0.0.1:5001:5001'
    networks:
      - monitoring
    depends_on:
      - loki
    # Critical: Chrome/Puppeteer requires sufficient shared memory
    # Default Docker shm is 64MB which causes "Target closed" errors
    shm_size: '2gb'
    # Security context for Chrome sandboxing
    security_opt:
      - seccomp:unconfined
    # Cap add for Chrome
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:latest
    container_name: shorthnd-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'  # Bind to localhost only
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      - backend
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:3.1.1
    container_name: shorthnd-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '127.0.0.1:3100:3100'  
    volumes:
      - loki-data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana-oss:latest
    container_name: shorthnd-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'  
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://grafana.vikalpshorthand.com
      GF_SERVER_DOMAIN: grafana.vikalpshorthand.com
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:
  prometheus-data:
  loki-data:

