# ================================================
# LOCAL DEVELOPMENT DOCKER COMPOSE
# ================================================
# This file is for local development only.
# For production deployment, use docker-compose.prod.yml
# 
# Usage:
#   Start all services: docker-compose up -d
#   View logs:          docker-compose logs -f
#   Stop all services:  docker-compose down
# ================================================

version: '3.9'

services:
  backend:
    build:
      context: .
    container_name: shorthnd-backend
    env_file:
      - .env
    environment:
      PORT: 5001
      NODE_ENV: production
      LOKI_URL: http://loki:3100
      ENABLE_LOKI_LOGS: "true"
      DOCKER_CONTAINER: "true"
    ports:
      - '5001:5001'
    depends_on:
      - loki
    networks:
      - monitoring
    # Critical: Chrome/Puppeteer requires at least 1GB shared memory
    # Default Docker shm is 64MB which causes "Target closed" errors
    shm_size: '2gb'
    # Security context for Chrome
    security_opt:
      - seccomp:unconfined
    # Cap add for Chrome sandboxing
    cap_add:
      - SYS_ADMIN

  prometheus:
    image: prom/prometheus:latest
    container_name: shorthnd-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.1.1
    container_name: shorthnd-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: shorthnd-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-storage:

