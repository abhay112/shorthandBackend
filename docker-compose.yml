# ================================================
# LOCAL DEVELOPMENT DOCKER COMPOSE
# ================================================
# This file is for local development only.
# For production deployment, use docker-compose.prod.yml
# 
# Usage:
#   Start all services: docker-compose up -d
#   View logs:          docker-compose logs -f
#   Stop all services:  docker-compose down
# ================================================

version: '3.9'

services:
  backend:
    build:
      context: .
    container_name: shorthnd-backend
    env_file:
      - .env
    environment:
      PORT: 5001
      NODE_ENV: production
      DOCKER_CONTAINER: "true"
    ports:
      - '5001:5001'
    # Critical: Chrome/Puppeteer requires at least 1GB shared memory
    # Default Docker shm is 64MB which causes "Target closed" errors
    shm_size: '2gb'
    # Security context for Chrome
    security_opt:
      - seccomp:unconfined
    # Cap add for Chrome sandboxing
    cap_add:
      - SYS_ADMIN


