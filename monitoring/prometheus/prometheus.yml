global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: shorthnd-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - '172.17.0.1:5001'  # Docker bridge gateway (backend running on host with PM2)
          # Alternative: Use host.docker.internal if supported, or actual host IP

